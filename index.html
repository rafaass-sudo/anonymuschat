<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aplikasi Chat dengan Custom Profil</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Custom scrollbar untuk area chat */
    #chat-box::-webkit-scrollbar {
      width: 6px;
    }
    #chat-box::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden flex flex-col h-[650px]">
    
    <!-- HEADER CHAT (Tampilan Profil Aktif saat Ngobrol) -->
    <div class="bg-indigo-600 p-4 text-white flex items-center justify-between shadow-md z-10">
      <div class="flex items-center gap-3">
        <div class="relative">
          <img 
            id="chat-header-avatar" 
            src="https://via.placeholder.com/150" 
            alt="Profil" 
            class="w-11 h-11 rounded-full object-cover border-2 border-white shadow-sm"
            onerror="this.onerror=null;this.src='https://via.placeholder.com/150';"
          />
          <span class="w-3 h-3 bg-green-400 border-2 border-indigo-600 rounded-full absolute bottom-0 right-0"></span>
        </div>
        <div class="flex flex-col">
          <div class="flex items-center gap-2">
            <h2 id="chat-header-name" class="font-bold text-base leading-tight">Pengguna</h2>
            <span id="chat-header-age-badge" class="bg-indigo-500 text-indigo-100 text-xs px-2 py-0.5 rounded-full font-medium">
              <span id="chat-header-age">0</span> thn
            </span>
          </div>
          <span class="text-xs text-indigo-200 mt-0.5">Online</span>
        </div>
      </div>
      
      <!-- Tombol Pengaturan Profil -->
      <button 
        onclick="toggleProfileModal(true)" 
        class="bg-indigo-700 hover:bg-indigo-800 p-2 rounded-lg transition text-xs font-medium flex items-center gap-1"
      >
        <span>✏️</span> Edit
      </button>
    </div>

    <!-- AREA OBROLAN / CHAT BOX -->
    <div id="chat-box" class="flex-1 p-4 overflow-y-auto bg-slate-50 flex flex-col gap-3">
      <!-- Pesan otomatis/sapaan awal -->
      <div class="text-center my-2">
        <span class="text-xs bg-gray-200 text-gray-600 px-3 py-1 rounded-full">Obrolan Dimulai</span>
      </div>
    </div>

    <!-- INPUT PESAN -->
    <form id="chat-form" onsubmit="handleSendMessage(event)" class="p-3 bg-white border-t flex items-center gap-2">
      <input 
        type="text" 
        id="message-input" 
        placeholder="Ketik pesan di sini..." 
        class="flex-1 border rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50"
        required
      />
      <button 
        type="submit" 
        class="bg-indigo-600 text-white px-5 py-2.5 rounded-xl font-medium text-sm hover:bg-indigo-700 transition"
      >
        Kirim
      </button>
    </form>

  </div>

  <!-- MODAL CUSTOM PROFIL -->
  <div id="profile-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <h3 class="text-lg font-bold text-gray-800 mb-4">Custom Profil Anda</h3>
      
      <form onsubmit="handleSaveProfile(event)" class="flex flex-col gap-4">
        <!-- Input Nama -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nama Lengkap</label>
          <input 
            type="text" 
            id="input-name" 
            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" 
            placeholder="Masukkan Nama"
            required
          />
        </div>

        <!-- Input Umur -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Umur (Tahun)</label>
          <input 
            type="number" 
            id="input-age" 
            class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" 
            placeholder="Masukkan Umur"
            min="1" 
            max="120"
            required
          />
        </div>

        <!-- Input Foto Profil (Upload File) -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Foto Profil</label>
          <input 
            type="file" 
            id="input-avatar" 
            accept="image/*" 
            onchange="previewImage(event)"
            class="w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100"
          />
        </div>

        <!-- Preview Foto -->
        <div class="flex justify-center my-1">
          <img 
            id="preview-avatar" 
            src="https://via.placeholder.com/150" 
            alt="Preview" 
            class="w-16 h-16 rounded-full object-cover border-2 border-indigo-500"
          />
        </div>

        <!-- Tombol Aksi -->
        <div class="flex gap-2 mt-2">
          <button 
            type="button" 
            onclick="toggleProfileModal(false)" 
            class="flex-1 border text-gray-600 py-2 rounded-xl text-sm font-medium hover:bg-gray-50 transition"
          >
            Batal
          </button>
          <button 
            type="submit" 
            class="flex-1 bg-indigo-600 text-white py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition"
          >
            Simpan Profil
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // 1. MASTER STATE PROFIL (Diambil dari LocalStorage agar tersimpan permanen)
    let userProfile = {
      name: "User Custom",
      age: 20,
      avatar: "https://via.placeholder.com/150"
    };

    // Variabel temporary untuk preview gambar Base64
    let tempAvatarBase64 = null;

    // 2. INISIALISASI SAAT HALAMAN DIMUAT
    window.addEventListener('DOMContentLoaded', () => {
      loadProfileFromStorage();
      renderHeaderProfile();
    });

    // Load data profil dari localStorage
    function loadProfileFromStorage() {
      const savedData = localStorage.getItem('app_user_profile');
      if (savedData) {
        try {
          userProfile = JSON.parse(savedData);
        } catch (e) {
          console.error("Gagal membaca profil dari localStorage", e);
        }
      }
    }

    // 3. FUNGSI UTAMA: UPDATE RENDER HEADER CHAT (Menjamin Profil Tidak Hilang)
    function renderHeaderProfile() {
      const nameEl = document.getElementById('chat-header-name');
      const ageEl = document.getElementById('chat-header-age');
      const avatarEl = document.getElementById('chat-header-avatar');

      // Set data dengan proteksi fallback
      nameEl.textContent = userProfile.name || "Tanpa Nama";
      ageEl.textContent = userProfile.age || "0";
      avatarEl.src = userProfile.avatar || "https://via.placeholder.com/150";
    }

    // Toggle Modal Pengaturan Profil
    function toggleProfileModal(show) {
      const modal = document.getElementById('profile-modal');
      if (show) {
        // Isi form modal dengan data saat ini
        document.getElementById('input-name').value = userProfile.name;
        document.getElementById('input-age').value = userProfile.age;
        document.getElementById('preview-avatar').src = userProfile.avatar;
        tempAvatarBase64 = userProfile.avatar; // Set nilai awal
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    // Preview foto yang diupload dan konversi ke Base64
    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          tempAvatarBase64 = e.target.result;
          document.getElementById('preview-avatar').src = tempAvatarBase64;
        };
        reader.readAsDataURL(file);
      }
    }

    // SIMPAN CUSTOM PROFIL
    function handleSaveProfile(event) {
      event.preventDefault();

      // Ambil nilai dari form
      const newName = document.getElementById('input-name').value.trim();
      const newAge = document.getElementById('input-age').value;

      // Update Master State Profil
      userProfile = {
        name: newName || "Tanpa Nama",
        age: newAge || 0,
        avatar: tempAvatarBase64 || userProfile.avatar
      };

      // Simpan ke localStorage agar tidak hilang saat refresh
      localStorage.setItem('app_user_profile', JSON.stringify(userProfile));

      // Re-render Header Chat seketika
      renderHeaderProfile();

      // Tutup Modal
      toggleProfileModal(false);
    }

    // KIRIM PESAN CHAT
    function handleSendMessage(event) {
      event.preventDefault();
      const inputEl = document.getElementById('message-input');
      const text = inputEl.value.trim();

      if (!text) return;

      const chatBox = document.getElementById('chat-box');

      // Buat Elemen Bubble Chat dengan Menggunakan Data Profil Aktif
      const messageElement = document.createElement('div');
      messageElement.className = "flex items-end gap-2 justify-end my-1";

      messageElement.innerHTML = `
        <div class="flex flex-col items-end max-w-[80%]">
          <div class="flex items-center gap-1.5 mb-1">
            <span class="text-[10px] text-gray-500 font-semibold">${userProfile.name} (${userProfile.age} thn)</span>
          </div>
          <div class="bg-indigo-600 text-white px-3.5 py-2 rounded-2xl rounded-tr-none text-sm shadow-sm break-words">
            ${escapeHTML(text)}
          </div>
        </div>
        <img 
          src="${userProfile.avatar}" 
          alt="${userProfile.name}" 
          class="w-7 h-7 rounded-full object-cover border border-gray-200 mb-0.5"
          onerror="this.onerror=null;this.src='https://via.placeholder.com/150';"
        />
      `;

      chatBox.appendChild(messageElement);
      
      // Auto Scroll ke bawah
      chatBox.scrollTop = chatBox.scrollHeight;

      // Reset Input
      inputEl.value = '';
    }

    // Helper mencegah XSS Inject
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }
  </script>
</body>
</html>

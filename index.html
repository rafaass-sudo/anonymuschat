<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Anonymous Chat Realtime</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; }
        header { 
            background: #1f1f1f; 
            padding: 15px; 
            text-align: center; 
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .online-badge {
            background: #28a745;
            color: #fff;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .online-dot {
            width: 8px;
            height: 8px;
            background-color: #fff;
            border-radius: 50%;
            display: inline-block;
        }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 8px; font-size: 14px; word-wrap: break-word; }
        .my-msg { background: #007bff; align-self: flex-end; }
        .stranger-msg { background: #333; align-self: flex-start; }
        .system-msg { align-self: center; background: transparent; color: #888; font-size: 12px; }
        #controls { display: flex; padding: 10px; background: #1f1f1f; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; }
        button { padding: 12px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #btn-send { background: #28a745; color: #fff; }
        #btn-start { background: #007bff; color: #fff; }
    </style>

    <!-- PeerJS & MQTT Client -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <header>
        <h2>Anonymous P2P Chat</h2>
        <div class="online-badge">
            <span class="online-dot"></span>
            <span id="online-count">0</span> Online
        </div>
    </header>

    <div id="chat-box"></div>

    <div id="controls">
        <button id="btn-start" onclick="startSearch()">Start Chat</button>
        <input type="text" id="msg-input" placeholder="Ketik pesan..." disabled onkeypress="handleKeyPress(event)">
        <button id="btn-send" onclick="sendMessage()" disabled>Kirim</button>
    </div>

    <script>
        const SIGNAL_TOPIC = "anonchat_queue_public_v2";
        const PRESENCE_TOPIC = "anonchat_presence_v2/";
        
        let peer = null;
        let conn = null;
        let mqttClient = null;
        let myPeerId = "user_" + Math.random().toString(36).substr(2, 8);
        
        let activeUsers = new Map();
        let heartbeatInterval = null;

        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const btnSend = document.getElementById('btn-send');
        const onlineCountEl = document.getElementById('online-count');

        function addSystemMsg(text) {
            const div = document.createElement('div');
            div.className = 'message system-msg';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addMsg(text, isMe) {
            const div = document.createElement('div');
            div.className = `message ${isMe ? 'my-msg' : 'stranger-msg'}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // --- SISTEM ONLINE COUNTER REALTIME ---
        function initPresenceSystem() {
            mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
                will: {
                    topic: PRESENCE_TOPIC + myPeerId,
                    payload: '',
                    qos: 0,
                    retain: true
                }
            });

            mqttClient.on('connect', () => {
                // Subscribe topik pendaftaran pencarian & presensi online
                mqttClient.subscribe(SIGNAL_TOPIC);
                mqttClient.subscribe(PRESENCE_TOPIC + '+');

                // Kirim sinyal bahwa user ini online
                sendHeartbeat();
                heartbeatInterval = setInterval(sendHeartbeat, 5000);
            });

            mqttClient.on('message', (topic, message) => {
                const payloadStr = message.toString();

                // Handler untuk perhitungan user online
                if (topic.startsWith(PRESENCE_TOPIC)) {
                    const userId = topic.replace(PRESENCE_TOPIC, '');

                    if (payloadStr === '') {
                        activeUsers.delete(userId);
                    } else {
                        activeUsers.set(userId, Date.now());
                    }
                    updateOnlineCount();
                    return;
                }

                // Handler untuk matching chat
                try {
                    const data = JSON.parse(payloadStr);
                    if (data.action === 'search' && data.id !== myPeerId && !conn) {
                        conn = peer.connect(data.id);
                        conn.on('open', () => {
                            setupConnectionHandlers();
                        });
                    }
                } catch(e) {}
            });

            // Pembersihan berkala jika ada user yang disconnect tanpa 'will'
            setInterval(() => {
                const now = Date.now();
                activeUsers.forEach((lastSeen, uId) => {
                    if (now - lastSeen > 12000) {
                        activeUsers.delete(uId);
                    }
                });
                updateOnlineCount();
            }, 5000);
        }

        function sendHeartbeat() {
            if (mqttClient && mqttClient.connected) {
                mqttClient.publish(PRESENCE_TOPIC + myPeerId, '1', { retain: true });
            }
        }

        function updateOnlineCount() {
            onlineCountEl.innerText = activeUsers.size;
        }

        // --- SISTEM P2P CHAT ---
        function startSearch() {
            if (conn) conn.close();
            if (peer) peer.destroy();

            chatBox.innerHTML = '';
            addSystemMsg('Menyiapkan koneksi P2P...');
            msgInput.disabled = true;
            btnSend.disabled = true;

            peer = new Peer(myPeerId);

            peer.on('open', (id) => {
                addSystemMsg('Mencari lawan bicara...');
                if (mqttClient && mqttClient.connected) {
                    mqttClient.publish(SIGNAL_TOPIC, JSON.stringify({ id: myPeerId, action: 'search' }));
                }
            });

            peer.on('connection', (incomingConn) => {
                conn = incomingConn;
                setupConnectionHandlers();
            });
        }

        function setupConnectionHandlers() {
            addSystemMsg('Terhubung langsung (P2P) dengan orang asing!');
            msgInput.disabled = false;
            btnSend.disabled = false;

            conn.on('data', (data) => {
                addMsg(data, false);
            });

            conn.on('close', () => {
                addSystemMsg('Lawan bicara terputus.');
                msgInput.disabled = true;
                btnSend.disabled = true;
            });
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text && conn && conn.open) {
                addMsg(text, true);
                conn.send(text);
                msgInput.value = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // Jalankan pelacak presensi saat halaman dimuat
        window.onload = initPresenceSystem;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Random Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; background: #121212; color: #fff; }
        header { background: #1f1f1f; padding: 15px; text-align: center; border-bottom: 1px solid #333; }
        #chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 14px; border-radius: 8px; font-size: 14px; word-wrap: break-word; }
        .my-msg { background: #007bff; align-self: flex-end; }
        .stranger-msg { background: #333; align-self: flex-start; }
        .system-msg { align-self: center; background: transparent; color: #888; font-size: 12px; }
        #controls { display: flex; padding: 10px; background: #1f1f1f; gap: 8px; }
        input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; outline: none; }
        button { padding: 12px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #btn-send { background: #28a745; color: #fff; }
        #btn-start { background: #007bff; color: #fff; }
    </style>

    <!-- Firebase SDK (Version 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <header>
        <h2>Random Anonymous Chat</h2>
    </header>

    <div id="chat-box"></div>

    <div id="controls">
        <button id="btn-start" onclick="startChat()">Start / Skip</button>
        <input type="text" id="msg-input" placeholder="Ketik pesan..." disabled onkeypress="handleKeyPress(event)">
        <button id="btn-send" onclick="sendMessage()" disabled>Kirim</button>
    </div>

    <script>
        // GANTI DENGAN KONFIGURASI FIREBASE ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyCunqUAW-VAwoJn_XtPJ5AlQA42SWhfCco",
            authDomain: "anonchat-e7326.firebaseapp.com",
            databaseURL: "https://anonchat-e7326-default-rtdb.firebaseio.com",
            projectId: "anonchat-e7326",
            storageBucket: "anonchat-e7326.firebasestorage.app",
            messagingSenderId: "833151133042",
            appId: "1:833151133042:web:dd9bbebebcd319539269eb"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const myId = 'user_' + Math.random().toString(36).substr(2, 9);
        let roomId = null;
        let roomRef = null;

        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const btnSend = document.getElementById('btn-send');

        function addSystemMsg(text) {
            const div = document.createElement('div');
            div.className = 'message system-msg';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addMsg(text, isMe) {
            const div = document.createElement('div');
            div.className = `message ${isMe ? 'my-msg' : 'stranger-msg'}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function startChat() {
            if (roomId && roomRef) {
                roomRef.off();
                db.ref('rooms/' + roomId).remove();
            }

            chatBox.innerHTML = '';
            addSystemMsg('Mencari lawan bicara...');
            msgInput.disabled = true;
            btnSend.disabled = true;

            const queueRef = db.ref('queue');

            queueRef.once('value').then(snapshot => {
                const queueData = snapshot.val();
                let partnerId = null;

                if (queueData) {
                    for (let id in queueData) {
                        if (id !== myId) {
                            partnerId = id;
                            break;
                        }
                    }
                }

                if (partnerId) {
                    // Gabung ke room pasangan
                    roomId = `room_${partnerId}_${myId}`;
                    queueRef.child(partnerId).remove();
                    connectToRoom(roomId);
                    db.ref('queue_match/' + partnerId).set(roomId);
                } else {
                    // Masuk ke dalam antrean
                    queueRef.child(myId).set(true);

                    // Dengarkan jika ada lawan bicara yang menghubungkan
                    const matchRef = db.ref('queue_match/' + myId);
                    matchRef.on('value', snap => {
                        if (snap.exists()) {
                            roomId = snap.val();
                            matchRef.remove();
                            queueRef.child(myId).remove();
                            connectToRoom(roomId);
                        }
                    });
                }
            });
        }

        function connectToRoom(rId) {
            addSystemMsg('Terhubung dengan orang asing! Mulai obrolan.');
            msgInput.disabled = false;
            btnSend.disabled = false;

            roomRef = db.ref('rooms/' + rId);
            roomRef.on('child_added', snapshot => {
                const data = snapshot.val();
                if (data.sender !== myId) {
                    addMsg(data.text, false);
                }
            });
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text && roomId) {
                addMsg(text, true);
                roomRef.push({
                    sender: myId,
                    text: text,
                    timestamp: Date.now()
                });
                msgInput.value = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        window.onbeforeunload = function() {
            if (roomId && roomRef) roomRef.remove();
            db.ref('queue/' + myId).remove();
        };
    </script>
</body>
</html>

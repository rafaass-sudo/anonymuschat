<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anonymous P2P Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .app-container {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: #1e293b;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .app-container {
                max-width: 768px;
                height: 90vh;
                max-height: 850px;
                border-radius: 16px;
                border: 1px solid #334155;
            }
        }

        header {
            background-color: #0f172a;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            flex-shrink: 0; /* Header tidak akan tertekan/mengecil */
        }

        header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f1f5f9;
        }

        .online-badge {
            background-color: #059669;
            color: #ecfdf5;
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background-color: #34d399;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* --- AREA CHAT (DIBESARKAN & BEBAS KONTROL) --- */
        #chat-box {
            flex: 1;
            padding: 16px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #1e293b;
            /* Memastikan ada ruang penggulungan yang cukup sebelum menyentuh batas input */
            scroll-behavior: smooth;
        }

        .message {
            max-width: 88%; /* Diperlebar sedikit untuk tampilan HP */
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        @media (min-width: 768px) {
            .message {
                max-width: 70%;
            }
        }

        .my-msg {
            background-color: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .stranger-msg {
            background-color: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .system-msg {
            align-self: center;
            background-color: rgba(51, 65, 85, 0.5);
            color: #94a3b8;
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 9999px;
            text-align: center;
            margin: 4px 0;
        }

        /* --- AREA KONTROL DAN INPUT (TERKUNCI DI BAWAH) --- */
        #controls {
            display: flex;
            padding: 12px 14px;
            background-color: #0f172a;
            gap: 8px;
            border-top: 1px solid #334155;
            flex-shrink: 0; /* Menjaga area tombol/input tidak tertutup atau tergeser */
            align-items: center;
        }

        input {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            min-width: 0; /* Mencegah input meluap dari kontainer di HP kecil */
        }

        input:focus {
            border-color: #2563eb;
        }

        input:disabled {
            background-color: #0f172a;
            opacity: 0.5;
            cursor: not-allowed;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 0.2s, opacity 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-start-style {
            background-color: #2563eb;
            color: #ffffff;
        }

        .btn-stop-style {
            background-color: #dc2626;
            color: #ffffff;
        }

        #btn-send {
            background-color: #10b981;
            color: #ffffff;
        }

        #btn-send:hover:not(:disabled) {
            background-color: #059669;
        }
    </style>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <div class="app-container">
        <header>
            <h2>Anonymous Chat</h2>
            <div class="online-badge">
                <span class="online-dot"></span>
                <span id="online-count">0</span> Online
            </div>
        </header>

        <div id="chat-box"></div>

        <div id="controls">
            <button id="btn-action" class="btn-start-style" onclick="handleActionClick()">Start</button>
            <input type="text" id="msg-input" placeholder="Ketik pesan..." disabled onkeypress="handleKeyPress(event)">
            <button id="btn-send" onclick="sendMessage()" disabled>Kirim</button>
        </div>
    </div>

    <script>
        const SIGNAL_TOPIC = "anonchat_queue_public_v2";
        const PRESENCE_TOPIC = "anonchat_presence_v2/";
        
        let peer = null;
        let conn = null;
        let mqttClient = null;
        let myPeerId = "user_" + Math.random().toString(36).substr(2, 8);
        
        let activeUsers = new Map();
        let isConnected = false;

        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const btnSend = document.getElementById('btn-send');
        const btnAction = document.getElementById('btn-action');
        const onlineCountEl = document.getElementById('online-count');

        function addSystemMsg(text) {
            const div = document.createElement('div');
            div.className = 'message system-msg';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addMsg(text, isMe) {
            const div = document.createElement('div');
            div.className = `message ${isMe ? 'my-msg' : 'stranger-msg'}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function initPresenceSystem() {
            mqttClient = mqtt.connect('wss://broker.hivemq.com:8884/mqtt', {
                will: {
                    topic: PRESENCE_TOPIC + myPeerId,
                    payload: '',
                    qos: 0,
                    retain: true
                }
            });

            mqttClient.on('connect', () => {
                mqttClient.subscribe(SIGNAL_TOPIC);
                mqttClient.subscribe(PRESENCE_TOPIC + '+');

                sendHeartbeat();
                setInterval(sendHeartbeat, 5000);
            });

            mqttClient.on('message', (topic, message) => {
                const payloadStr = message.toString();

                if (topic.startsWith(PRESENCE_TOPIC)) {
                    const userId = topic.replace(PRESENCE_TOPIC, '');

                    if (payloadStr === '') {
                        activeUsers.delete(userId);
                    } else {
                        activeUsers.set(userId, Date.now());
                    }
                    updateOnlineCount();
                    return;
                }

                try {
                    const data = JSON.parse(payloadStr);
                    if (data.action === 'search' && data.id !== myPeerId && !conn && !isConnected) {
                        conn = peer.connect(data.id);
                        conn.on('open', () => {
                            setupConnectionHandlers();
                        });
                    }
                } catch(e) {}
            });

            setInterval(() => {
                const now = Date.now();
                activeUsers.forEach((lastSeen, uId) => {
                    if (now - lastSeen > 12000) {
                        activeUsers.delete(uId);
                    }
                });
                updateOnlineCount();
            }, 5000);
        }

        function sendHeartbeat() {
            if (mqttClient && mqttClient.connected) {
                mqttClient.publish(PRESENCE_TOPIC + myPeerId, '1', { retain: true });
            }
        }

        function updateOnlineCount() {
            onlineCountEl.innerText = activeUsers.size;
        }

        function handleActionClick() {
            if (isConnected) {
                stopChat(true);
            } else {
                startSearch();
            }
        }

        function setActionState(state) {
            if (state === 'connected') {
                btnAction.innerText = 'Stop';
                btnAction.className = 'btn-stop-style';
                isConnected = true;
                msgInput.disabled = false;
                btnSend.disabled = false;
            } else {
                btnAction.innerText = 'Next';
                btnAction.className = 'btn-start-style';
                isConnected = false;
                msgInput.disabled = true;
                btnSend.disabled = true;
            }
        }

        function stopChat(initiatedByMe) {
            if (conn) {
                conn.close();
                conn = null;
            }
            setActionState('disconnected');
            if (initiatedByMe) {
                addSystemMsg('Anda telah memutuskan obrolan.');
            }
        }

        function startSearch() {
            if (conn) conn.close();
            if (peer) peer.destroy();

            chatBox.innerHTML = '';
            addSystemMsg('Menyiapkan koneksi P2P...');
            setActionState('disconnected');
            btnAction.innerText = 'Mencari...';

            peer = new Peer(myPeerId);

            peer.on('open', (id) => {
                addSystemMsg('Mencari lawan bicara...');
                if (mqttClient && mqttClient.connected) {
                    mqttClient.publish(SIGNAL_TOPIC, JSON.stringify({ id: myPeerId, action: 'search' }));
                }
            });

            peer.on('connection', (incomingConn) => {
                if (isConnected) return;
                conn = incomingConn;
                setupConnectionHandlers();
            });
        }

        function setupConnectionHandlers() {
            setActionState('connected');
            addSystemMsg('Terhubung dengan orang asing!');

            conn.on('data', (data) => {
                addMsg(data, false);
            });

            conn.on('close', () => {
                if (isConnected) {
                    addSystemMsg('Lawan bicara telah memutuskan percakapan.');
                    stopChat(false);
                }
            });
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text && conn && conn.open) {
                addMsg(text, true);
                conn.send(text);
                msgInput.value = '';
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        window.onload = initPresenceSystem;
    </script>
</body>
</html>

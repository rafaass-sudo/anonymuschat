<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AnonChat P2P Fixed</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .hidden { display: none !important; }
        
        .app-container { width: 100%; max-width: 500px; height: 100vh; display: flex; flex-direction: column; background-color: #1e293b; }
        @media (min-width: 600px) { .app-container { height: 90vh; border-radius: 12px; border: 1px solid #334155; } }

        header { padding: 12px 16px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        #chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .message { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; }
        .my-msg { background: #2563eb; align-self: flex-end; }
        .stranger-msg { background: #334155; align-self: flex-start; }
        .system-msg { align-self: center; background: rgba(255,255,255,0.1); color: #94a3b8; font-size: 0.8rem; border-radius: 20px; }

        #controls { padding: 12px; background: #0f172a; display: flex; gap: 8px; border-top: 1px solid #334155; }
        #controls input { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; outline: none; }
        #controls button { padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-start { background: #2563eb; color: #fff; }
        .btn-stop { background: #dc2626; color: #fff; }
        .btn-send { background: #10b981; color: #fff; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <div class="app-container">
        <header>
            <h3>AnonChat P2P</h3>
            <span id="status-text" style="font-size: 0.8rem; color: #10b981;">Online</span>
        </header>

        <div id="chat-box"></div>

        <div id="controls">
            <button id="btn-action" class="btn-start" onclick="toggleSearch()">Cari Lawan</button>
            <input type="text" id="msg-input" placeholder="Ketik pesan..." disabled onkeypress="if(event.key==='Enter') sendMessage()">
            <button id="btn-send" class="btn-send" onclick="sendMessage()" disabled>Kirim</button>
        </div>
    </div>

    <script>
        const SIGNAL_TOPIC = "anonchat_p2p_global_v5";
        let myPeerId = "peer_" + Math.random().toString(36).substr(2, 9);
        
        let peer = null;
        let conn = null;
        let mqttClient = null;
        let isSearching = false;
        let isConnected = false;

        const chatBox = document.getElementById('chat-box');
        const msgInput = document.getElementById('msg-input');
        const btnSend = document.getElementById('btn-send');
        const btnAction = document.getElementById('btn-action');

        // Inisialisasi PeerJS & MQTT
        function init() {
            peer = new Peer(myPeerId, {
                config: { 'iceServers': [{ urls: 'stun:stun.l.google.com:19302' }] }
            });

            peer.on('open', (id) => {
                addSystemMsg("Sistem siap. Klik 'Cari Lawan'.");
                initMQTT();
            });

            // Menerima Koneksi Masuk
            peer.on('connection', (incomingConn) => {
                if (isConnected) {
                    incomingConn.close();
                    return;
                }
                conn = incomingConn;
                setupConnection();
            });
        }

        function initMQTT() {
            mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

            mqttClient.on('connect', () => {
                mqttClient.subscribe(SIGNAL_TOPIC);
            });

            mqttClient.on('message', (topic, message) => {
                if (!isSearching || isConnected) return;

                try {
                    const payload = JSON.parse(message.toString());
                    
                    // Hindari sinyal milik sendiri
                    if (payload.id === myPeerId) return;

                    if (payload.action === 'searching') {
                        // Deterministic Matchmaking: ID yang secara abjad lebih kecil bertindak memanggil (Caller)
                        if (myPeerId < payload.id) {
                            connectToPeer(payload.id);
                        }
                    }
                } catch(e) {}
            });
        }

        function toggleSearch() {
            if (isConnected || isSearching) {
                stopChat();
            } else {
                startSearch();
            }
        }

        function startSearch() {
            isSearching = true;
            btnAction.innerText = "Batal";
            btnAction.className = "btn-stop";
            chatBox.innerHTML = "";
            addSystemMsg("Mencari orang asing...");

            // Broadcast sinyal bahwa pengguna sedang mencari
            broadcastSearchSignal();
        }

        function broadcastSearchSignal() {
            if (!isSearching || isConnected) return;

            if (mqttClient && mqttClient.connected) {
                mqttClient.publish(SIGNAL_TOPIC, JSON.stringify({
                    id: myPeerId,
                    action: 'searching',
                    timestamp: Date.now()
                }));
            }

            // Ulangi broadcast setiap 2.5 detik selama belum terhubung
            setTimeout(() => {
                if (isSearching && !isConnected) {
                    broadcastSearchSignal();
                }
            }, 2500);
        }

        function connectToPeer(targetPeerId) {
            addSystemMsg("Menghubungkan ke lawan...");
            conn = peer.connect(targetPeerId);
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                isSearching = false;
                isConnected = true;
                btnAction.innerText = "Stop";
                btnAction.className = "btn-stop";
                msgInput.disabled = false;
                btnSend.disabled = false;
                addSystemMsg("Terhubung dengan orang asing!");
            });

            conn.on('data', (data) => {
                addMsg(data, false);
            });

            conn.on('close', () => {
                addSystemMsg("Lawan bicara terputus.");
                stopChat();
            });
        }

        function stopChat() {
            if (conn) {
                conn.close();
                conn = null;
            }
            isSearching = false;
            isConnected = false;
            btnAction.innerText = "Cari Lawan";
            btnAction.className = "btn-start";
            msgInput.disabled = true;
            btnSend.disabled = true;
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (text && conn && conn.open) {
                addMsg(text, true);
                conn.send(text);
                msgInput.value = "";
            }
        }

        function addMsg(text, isMe) {
            const div = document.createElement('div');
            div.className = `message ${isMe ? 'my-msg' : 'stranger-msg'}`;
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addSystemMsg(text) {
            const div = document.createElement('div');
            div.className = 'message system-msg';
            div.innerText = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        window.onload = init;
    </script>
</body>
</html>
